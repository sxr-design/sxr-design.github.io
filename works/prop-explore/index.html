<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prop Explore · 登录</title>
<link rel="icon" type="image/png" href="assets/steam-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-login">
<div class="stage login-stage" id="stage">

  <!-- 左侧视觉区 -->
  <div class="login-visual">
    <img class="hero" id="loginHero" src="assets/hero-login.jpg" alt="CS2 角色视觉">
    <div class="orange-edge"></div>
    <div class="fade"></div>
  </div>

  <!-- 右侧登录面板 -->
  <div class="login-panel">
    <h1 class="brand-name">Prop Explore</h1>
    <p class="brand-desc">CS2 道具探索与训练平台</p>

    <h2 class="login-title">欢迎来到Prop Explore</h2>
    <p class="login-sub">登录 Prop Explore，继续你的进阶之旅。</p>

    <button type="button" class="steam-btn" id="steamBtn">
      <span class="steam-icon" role="img" aria-label="Steam"></span>
      <span class="steam-texts">
        <span class="steam-title">使用 Steam 快速登录</span><br>
        <span class="steam-sub">同步账号，保留你的训练记录</span>
      </span>
      <span class="steam-badge">推荐</span>
    </button>

    <div class="divider">
      <span class="line"></span>
      <span class="divider-text">或使用邮箱登录</span>
      <span class="line"></span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label class="field-label" for="email">邮箱地址</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="请输入邮箱地址" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="password">密码</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="显示密码">
            <svg id="iconEyeOpen" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 10C3.5 5.5 6.8 3.5 10 3.5C13.2 3.5 16.5 5.5 18.5 10C16.5 14.5 13.2 16.5 10 16.5C6.8 16.5 3.5 14.5 1.5 10Z"/>
              <circle cx="10" cy="10" r="2.6"/>
            </svg>
            <svg id="iconEyeOff" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M2 10c2-4.2 4.9-6.2 8-6.2 1.6 0 3.1.5 4.4 1.5M18 10c-.9 1.7-2 3.1-3.3 4.2"/>
              <path d="M4 16.5 16 3.5"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="login-options">
        <span class="remember" id="rememberRow">
          <span class="checkbox" id="rememberBox">✓</span>
          <span class="remember-text">记住我</span>
        </span>
        <a class="forgot" href="javascript:void(0)">忘记密码？</a>
      </div>

      <button type="submit" class="login-btn">登录</button>
    </form>

    <div class="register-row">
      <span class="hint">还没有账号？</span>
      <a class="link" href="javascript:void(0)">立即注册</a>
    </div>

    <div class="agree-row">
      <span>登录即表示你同意</span>
      <a class="doc" href="javascript:void(0)">《用户协议》</a>
      <span>和</span>
      <a class="doc" href="javascript:void(0)">《隐私政策》</a>
    </div>
  </div>

</div>
<script src="js/app.js"></script>
</body>
</html>
